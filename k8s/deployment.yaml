apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-api-deployment
  labels:
    app: dotnet-api
spec:
  replicas: 7   # <--- THIS IS WHERE YOU SET THE 4 INSTANCES!
  selector:
    matchLabels:
      app: dotnet-api
  template:
    metadata:
      labels:
        app: dotnet-api
    spec:
      containers:
      - name: dotnet-api-container
        image: margesh01/mysampleapi:15
        imagePullPolicy: Always  # Tells Kubernetes to use your local Docker image
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-api-service
spec:
  type: NodePort
  selector:
    app: dotnet-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080  # Exposes the API locally on port 30080